<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
      fill: url(#primaryGrad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 0.2px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-12px) translateX(8px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 5; opacity: 0.7; }
      50% { r: 8; opacity: 1; }
    }
    .pulsing-bg {
      transform-origin: 600px 180px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .data-flow-1 {
      stroke-dasharray: 10, 15;
      animation: dashMove 14s linear infinite;
    }
    .data-flow-2 {
      stroke-dasharray: 8, 12;
      animation: dashMove 9s linear infinite reverse;
    }
    .floating-dot {
      animation: floatParticle 5s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="356" x="2" y="2" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" opacity="0.12" filter="url(#glow)" class="pulsing-bg" />
  <circle cx="1000" cy="280" r="160" fill="#a855f7" opacity="0.1" filter="url(#glow)" class="pulsing-bg" />
  <circle cx="600" cy="320" r="180" fill="#06b6d4" opacity="0.08" filter="url(#glow)" class="pulsing-bg" />

  <!-- Animated Background Network / Flow Streams -->
  <g opacity="0.45">
    <!-- Stream Line 1 -->
    <path d="M 50 70 Q 300 20, 600 80 T 1150 60" fill="none" stroke="url(#streamGrad1)" stroke-width="2.5" class="data-flow-1" />
    <!-- Stream Line 2 -->
    <path d="M 50 300 Q 350 340, 650 280 T 1150 310" fill="none" stroke="url(#streamGrad2)" stroke-width="2.5" class="data-flow-2" />
    <!-- Cross flow connecting nodes -->
    <path d="M 120 75 C 220 180, 260 260, 340 295" fill="none" stroke="#4f46e5" stroke-width="1.2" stroke-dasharray="4,6" class="data-flow-1" opacity="0.6" />
    <path d="M 880 70 C 960 140, 980 220, 1080 305" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="4,6" class="data-flow-2" opacity="0.6" />
  </g>

  <!-- Dynamic Process Topology Cards / Badges (Side Wings) -->
  <!-- Left Wing Card: BPMN & State Orchestration -->
  <g transform="translate(60, 135)" opacity="0.9">
    <rect width="165" height="85" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="10" fill="#6366f1" opacity="0.3" />
    <circle cx="28" cy="28" r="5" fill="#818cf8" />
    <text x="46" y="32" class="node-text" fill="#cbd5e1">BPMN 2.0 Engine</text>
    <rect x="20" y="52" width="125" height="5" rx="2.5" fill="#1e293b" />
    <rect x="20" y="52" width="85" height="5" rx="2.5" fill="url(#primaryGrad)">
      <animate attributeName="width" values="30;110;85" dur="6s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="73" font-size="9" fill="#64748b" font-family="sans-serif">Stateful Automation</text>
  </g>

  <!-- Right Wing Card: Multi-User Human-in-the-Loop -->
  <g transform="translate(975, 135)" opacity="0.9">
    <rect width="165" height="85" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="10" fill="#06b6d4" opacity="0.3" />
    <circle cx="28" cy="28" r="5" fill="#38bdf8" />
    <text x="46" y="32" class="node-text" fill="#cbd5e1">Human-in-the-Loop</text>
    <rect x="20" y="52" width="125" height="5" rx="2.5" fill="#1e293b" />
    <rect x="20" y="52" width="95" height="5" rx="2.5" fill="url(#accentGrad)">
      <animate attributeName="width" values="40;120;95" dur="7s" repeatCount="indefinite" />
    </rect>
    <text x="20" y="73" font-size="9" fill="#64748b" font-family="sans-serif">Multi-Tenant Routing</text>
  </g>

  <!-- Floating Process Node Orbs -->
  <circle cx="240" cy="85" r="4" fill="#38bdf8" class="floating-dot" />
  <circle cx="950" cy="90" r="4.5" fill="#ec4899" class="floating-dot" style="animation-delay: 1.5s;" />
  <circle cx="290" cy="280" r="3.5" fill="#a855f7" class="floating-dot" style="animation-delay: 2.5s;" />
  <circle cx="920" cy="275" r="5" fill="#818cf8" class="floating-dot" style="animation-delay: 3.5s;" />

  <!-- Center Foreground Header Content (Guaranteed Unobscured) -->
  <g transform="translate(600, 110)">
    <!-- Category Pill -->
    <g transform="translate(-160, -25)">
      <rect width="320" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.8" stroke="#4f46e5" stroke-width="1" />
      <text x="160" y="18" text-anchor="middle" class="tagline-text">⚡ ENTERPRISE WORKFLOW &amp; BPMN ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="52" text-anchor="middle" class="title-text" filter="url(#glow)">Awesome Process Orchestration</text>
    
    <!-- Subtitle Line 1 -->
    <text x="0" y="94" text-anchor="middle" class="subtitle-text">Multi-User Workflows • Human-in-the-Loop Decisions • Durable State Machines</text>
    
    <!-- Subtitle Line 2 / Badges representation -->
    <text x="0" y="125" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif">
      Curated SaaS Platforms &amp; Open-Source Distributed Workflow Engines
    </text>
  </g>
</svg>
